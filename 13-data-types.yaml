- name: course information
  hosts: local
  connection: local
  vars:
    course: "AIOps with DevSecOps on AWS"  # string
    duration_in_hrs: 150    # number
    is_live_sessions: true  # boolean
    topics:  # list
      - Linux
      - Shell
      - Ansible
      - Terraform
    more details: # dictionary/map
      trainer: "Usman Shaik"
      months: 4
      Exact_duration_in_months: 4.5 
  tasks:
  - name: print the info and type
    debug:
      msg: |
        name:{{ course }} : {{ course | type_debug }}