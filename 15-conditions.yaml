- name: print OS is RedHat or not
  hosts: local
  connection: local
  tasks:
  - name: Install nginx in RedHat OS
    debug:
      state: present
      name: nginx
    when: ansible_facts.os_family == RedHat

  - name: Install nginx in Debian OS
    apt:
      state: present
      name: nginx
    when: ansible_facts.os_family == Debian  