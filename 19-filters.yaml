- name: demo on filters
  hosts: local
  connection: local
  vars:
    topics: Linus, Shell, Ansible, Terraform, Docker, Kubernetes
    names:
      - Usman
      - Shaik
      - DevOps
      - Engineer
    topic: ANSIBLE  
  tasks:
  - name: print the name
    debug:
      msg: "Hello {{ person_name | default('Usman') }}..!"
  - name: convert string to list
    debug:
      msg: "Topics are:{{ topics | split(',') | trim }}"    

  - name: convert list to string
    debug:
      msg: "Full Name:{{ names | join(' ') }}"   
  
  - name: convert string to lower case
      debug:
        msg: "Topic in lower case:{{ topic | lower }}"     