- name: demo on task level variables
  hosts: local
  connection: local
  vars:
    property: "100acers"
  tasks:
  - name: print the vars
    debug:
      msg: "Hi I got property {{ property }} from my father"

  - name: print the vars
    vars:
      property: "10acers"
    debug:
      msg: "Hi I got property {{ property }} from my father"    