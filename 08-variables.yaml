- name: variables from prompt
  hosts: local
  connection: local
  vars_prompt:
    - name: Username
      prompt: "Please enter your Username"
      private: false

    - name: "password"
      prompt: "Please enter your Password"
      private: true
    
  tasks:
  - name: Print the confidential information
    debug:
      msg: "Username is {{ Username }} and Password is {{ password }}"